---
# OWASP ZAP Automation Framework Plan — directly.social (Staging)
# Used by zap-full-scan.yml for scheduled/post-deploy authenticated DAST scans.
#
# Authentication Architecture (Two Layers):
#
#   Layer 1 — nginx HTTP Basic Auth:
#     Handled by the `replacer` job (first job). It injects
#     "Authorization: Basic ${STAGING_HTTP_B64}" into EVERY outgoing ZAP
#     request. STAGING_HTTP_B64 = base64(user:pass) is injected by the
#     GitHub Actions workflow as a Docker env variable.
#
#   Layer 2 — NextAuth Application Session:
#     Handled by the `requestor` job. It calls the staging-only endpoint
#     /api/zap/auth (only live when ZAP_ENABLED=true on staging).
#     ZAP captures the returned `authjs.session-token` cookie and attaches
#     it to all subsequent scan requests automatically.
#
# Docs: https://www.zaproxy.org/docs/automate/automation-framework/

env:
  contexts:
    - name: "directly-social-authenticated"
      urls:
        - "https://staging.directly.social"
      includePaths:
        - "https://staging.directly.social.*"
      excludePaths:
        # OAuth callbacks — ZAP cannot follow external OAuth provider redirects
        - "https://staging.directly.social/api/auth/callback/.*"
        # Internal infrastructure — skip to avoid corrupting staging data
        - "https://staging.directly.social/api/inngest.*"
        - "https://staging.directly.social/api/webhooks/stripe.*"
        - "https://staging.directly.social/api/upload.*"
        # The ZAP auth endpoint itself — exclude to avoid scan loops
        - "https://staging.directly.social/api/zap/.*"
      sessionManagement:
        method: "cookie"
        parameters:
          cookieName: "authjs.session-token"
      users:
        - name: "zap-test-user"
          credentials:
            username: "zap@directly.social"

  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # ── 0. Replacer: Inject nginx HTTP Basic Auth globally ─────────────────────
  # MUST run first so every subsequent request (including the auth requestor
  # call below) already carries the Authorization header that nginx requires.
  # STAGING_HTTP_B64 env var is set by the GitHub Actions workflow step.
  - type: replacer
    parameters:
      deleteAllRules: false
      rules:
        - description: "Staging nginx HTTP Basic Auth"
          matchType: "REQ_HEADER"
          matchString: "Authorization"
          replacement: "Basic ${STAGING_HTTP_B64}"
          initiators: []   # Empty = apply to ALL request types (spider, active scan, etc.)
          enabled: true

  # ── 1. Requestor: Log in to directly.social, capture NextAuth cookie ───────
  # Calls the staging-only /api/zap/auth endpoint.
  # ZAP captures the Set-Cookie response header (authjs.session-token)
  # and includes it automatically in all subsequent scan requests.
  # The endpoint is disabled in production (ZAP_ENABLED guard).
  - type: requestor
    parameters:
      requests:
        - url: "https://staging.directly.social/api/zap/auth"
          method: POST
          headers:
            Content-Type: "application/json"
          data: '{"email":"zap@directly.social","zapSecret":"${ZAP_AUTH_SECRET}"}'
          responseCode: 200

  # ── 2. Spider: Discover all accessible URLs ────────────────────────────────
  - type: spider
    parameters:
      context: "directly-social-authenticated"
      user: "zap-test-user"
      maxDuration: 5       # minutes — keeps CI runs under ~30 min total
      maxDepth: 10
      acceptCookies: true
    tests:
      - name: "At least 20 URLs discovered"
        type: "stats"
        statistic: "automation.spider.urls.added"
        operator: ">="
        value: 20
        onFail: "warn"

  # ── 3. Ajax Spider: Discover Next.js client-side routes ───────────────────
  - type: spiderAjax
    parameters:
      context: "directly-social-authenticated"
      user: "zap-test-user"
      maxDuration: 3       # minutes
      maxCrawlDepth: 5

  # ── 4. Passive Scan: Non-destructive header/response analysis ─────────────
  - type: passiveScan-wait
    parameters:
      maxDuration: 10      # minutes

  # ── 5. Active Scan: Real attack simulation ────────────────────────────────
  # Sends actual attack payloads (XSS, SQLi, path traversal, etc.)
  # Only safe to run against staging — NEVER production.
  - type: activeScan
    parameters:
      context: "directly-social-authenticated"
      user: "zap-test-user"
      policy: "Default Policy"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 60
      threadPerHost: 2     # Gentle on the VPS — increase if staging is robust

  # ── 6. Alert Filters: Suppress known Next.js/MUI false positives ──────────
  - type: alertFilter
    parameters:
      deleteGlobalAlerts: false
      alertFilters:
        - ruleId: 10096
          newRisk: "-1"    # Mark as False Positive
          url: ".*\\.next\\/static.*"
          urlRegex: true
        - ruleId: 10015
          newRisk: "-1"
          url: ".*\\.next\\/static.*"
          urlRegex: true

  # ── 7. Reports: HTML + SARIF ──────────────────────────────────────────────
  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk/reports"
      reportFile: "zap-full-report"
      reportTitle: "directly.social — OWASP ZAP Full Scan Report"
      reportDescription: "Authenticated DAST scan of https://staging.directly.social"
      displayReport: false
    risks:
      - high
      - medium
      - low
      - informational

  - type: report
    parameters:
      template: "sarif-json"
      reportDir: "/zap/wrk/reports"
      reportFile: "zap-full-report-sarif"
      displayReport: false
